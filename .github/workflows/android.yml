name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk 90-PLUS-STUDIO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 90-PLUS-STUDIO-APK
          path: 90-PLUS-STUDIO.apk
          retention-days: 30
